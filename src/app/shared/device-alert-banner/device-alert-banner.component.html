<!-- Device Alert Banner - apparaît uniquement quand l'appareil n'est pas vérifié -->
@if (isDeviceVerified() === false) {
  <div class="device-alert-banner">
    <div class="banner-content">
      <div class="banner-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="banner-message">
        <strong>Appareil non confirmé</strong>
        <p>Pour votre sécurité, veuillez confirmer cet appareil. Un email de confirmation a été envoyé à votre adresse.</p>
      </div>
    </div>
    <div class="banner-actions">
      <button
        class="action-button"
        (click)="resendVerificationEmail()"
        [disabled]="isChecking()">
        @if (isChecking()) {
          <span class="spinner"></span>
        } @else {
          <span>Renvoyer l'email</span>
        }
      </button>
    </div>
  </div>
}
