<nav class="crm-sidebar" [class.crm-sidebar--collapsed]="collapsed()">

  <div class="crm-sidebar__header">
    <span class="crm-sidebar__logo">CRM</span>
    <button class="crm-sidebar__toggle" (click)="toggle()" [title]="collapsed() ? 'Développer' : 'Réduire'">
      {{ collapsed() ? '›' : '‹' }}
    </button>
  </div>

  <button class="crm-sidebar__search-btn" (click)="searchRequested.emit()" [title]="collapsed() ? 'Rechercher (Ctrl+K)' : ''">
    <span class="crm-sidebar__icon">🔍</span>
    <span class="crm-sidebar__label">Rechercher…</span>
    @if (!collapsed()) {
      <kbd class="crm-sidebar__search-kbd">⌘K</kbd>
    }
  </button>

  <ul class="crm-sidebar__nav">
    @for (item of navItems; track item.route) {
      <li class="crm-sidebar__item">
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="crm-sidebar__link"
          [title]="collapsed() ? item.label : ''"
        >
          <span class="crm-sidebar__icon">{{ item.icon }}</span>
          <span class="crm-sidebar__label">{{ item.label }}</span>
          @if (getBadge(item) > 0) {
            <span class="crm-sidebar__badge" [class.crm-sidebar__badge--danger]="item.badgeKey === 'actions'">
              {{ getBadge(item) }}
            </span>
          }
        </a>
      </li>
    }
  </ul>

  <div class="crm-sidebar__footer">
    <a routerLink="/crm/settings/tags" routerLinkActive="active" class="crm-sidebar__link crm-sidebar__settings" [title]="collapsed() ? 'Tags' : ''">
      <span class="crm-sidebar__icon">🏷️</span>
      <span class="crm-sidebar__label">Tags</span>
    </a>
    @if (isAdmin()) {
      <a routerLink="/crm/settings/pipelines" routerLinkActive="active" class="crm-sidebar__link crm-sidebar__settings" [title]="collapsed() ? 'Paramètres' : ''">
        <span class="crm-sidebar__icon">⚙️</span>
        <span class="crm-sidebar__label">Paramètres</span>
      </a>
    }
    <a routerLink="/" class="crm-sidebar__back" [title]="collapsed() ? 'Quitter le CRM' : ''">
      <span class="crm-sidebar__icon">←</span>
      <span class="crm-sidebar__label">Quitter le CRM</span>
    </a>
  </div>

</nav>
