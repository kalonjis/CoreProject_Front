<div class="action-panel">
  <h3 class="action-panel__title">Réassigner</h3>

  <div class="action-panel__grid">
    <div class="action-panel__row action-panel__row--full">
      <label>Public ID du commercial</label>
      <input type="text" [(ngModel)]="assignedToPublicId" placeholder="uuid commercial (vide = désassigner)" />
    </div>
  </div>

  <div class="action-panel__footer">
    <button class="btn btn--primary" (click)="submit()" [disabled]="loading()">
      Réassigner
    </button>
    <button class="btn btn--ghost" (click)="cancelled.emit()">Annuler</button>
  </div>
</div>
