<div class="action-panel">
  <h3 class="action-panel__title">Assigner le lead</h3>

  <div class="action-panel__row">
    <label>Public ID du commercial</label>
    <input type="text" [(ngModel)]="commercialPublicId" placeholder="uuid du commercial" />
  </div>

  <div class="action-panel__footer">
    <button class="btn btn--primary" (click)="submit()" [disabled]="loading() || !commercialPublicId.trim()">
      Confirmer
    </button>
    <button class="btn btn--ghost" (click)="cancelled.emit()">Annuler</button>
  </div>
</div>
