<div class="crm-modal-overlay" (click)="cancelled.emit()">
  <div class="crm-modal" (click)="$event.stopPropagation()">

    <div class="crm-modal__header">
      <h3 class="crm-modal__title">Assigner le lead</h3>
      <button class="crm-modal__close" type="button" (click)="cancelled.emit()">✕</button>
    </div>

    <div class="crm-modal__body">
      <div class="action-panel">
        <div class="action-panel__row">
          <label for="commercial-select">Commercial</label>
          @if (commercials().length === 0) {
            <p class="action-panel__hint">Chargement…</p>
          } @else {
            <select id="commercial-select" [(ngModel)]="selectedPublicId">
              <option value="" disabled>— Sélectionner un commercial —</option>
              @for (c of commercials(); track c.publicId) {
                <option [value]="c.publicId">{{ displayName(c) }}</option>
              }
            </select>
          }
        </div>

        <div class="action-panel__footer">
          <button class="btn btn--primary" (click)="submit()" [disabled]="loading() || !selectedPublicId">
            Confirmer
          </button>
          <button class="btn btn--ghost" type="button" (click)="cancelled.emit()">Annuler</button>
        </div>
      </div>
    </div>

  </div>
</div>
