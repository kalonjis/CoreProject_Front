<div class="contact-info-card">
  <div class="contact-info-card__row">
    <div class="contact-info-card__field">
      <span class="contact-info-card__label">Statut</span>
      <app-contact-status-badge [status]="contact.status" />
    </div>
    <div class="contact-info-card__field">
      <span class="contact-info-card__label">Assigné à</span>
      <app-crm-assign-popover
        [assigneeName]="contact.assignedToUsername"
        [commercials]="commercials()"
        [compact]="false"
        (selected)="onAssigneeSelected($event)"
      />
    </div>
    @if (contact.originLeadPublicId) {
      <div class="contact-info-card__field">
        <span class="contact-info-card__label">Lead d'origine</span>
        <a class="contact-info-card__link" [routerLink]="['/crm/leads', contact.originLeadPublicId]">
          Voir le lead →
        </a>
      </div>
    }
    <div class="contact-info-card__field">
      <span class="contact-info-card__label">Compte lié</span>
      <span class="contact-info-card__value">{{ contact.hasLinkedUser ? 'Oui' : 'Non' }}</span>
    </div>
    <div class="contact-info-card__field">
      <span class="contact-info-card__label">Mis à jour</span>
      <span class="contact-info-card__value">{{ contact.updatedAt | date:'dd/MM/yyyy HH:mm' }}</span>
    </div>
  </div>

  @if (contact.notes) {
    <div class="contact-info-card__notes">
      <span class="contact-info-card__label">Notes</span>
      <p class="contact-info-card__value">{{ contact.notes }}</p>
    </div>
  }
</div>
