<div class="action-panel">
  <h3 class="action-panel__title">Assigner le contact</h3>

  <div class="action-panel__row">
    <label>Public ID du commercial <small>(laisser vide pour désassigner)</small></label>
    <input type="text" [(ngModel)]="commercialPublicId" placeholder="uuid du commercial" />
  </div>

  <div class="action-panel__footer">
    <button class="btn btn--primary" (click)="submit()" [disabled]="loading()">Confirmer</button>
    <button class="btn btn--ghost" (click)="cancelled.emit()">Annuler</button>
  </div>
</div>
