<div class="ca-list">

  <div class="ca-list__header">
    <h1 class="ca-list__title">Mes actions</h1>
  </div>

  <div class="ca-list__filters">
    <button
      class="btn btn--filter"
      [class.btn--filter-active]="facade.filter() === CommercialActionStatus.PENDING"
      (click)="setFilter(CommercialActionStatus.PENDING)">
      En attente
    </button>
    <button
      class="btn btn--filter"
      [class.btn--filter-active]="facade.filter() === CommercialActionStatus.DONE"
      (click)="setFilter(CommercialActionStatus.DONE)">
      Terminées
    </button>
    <button
      class="btn btn--filter"
      [class.btn--filter-active]="facade.filter() === CommercialActionStatus.CANCELLED"
      (click)="setFilter(CommercialActionStatus.CANCELLED)">
      Annulées
    </button>
    <button
      class="btn btn--filter"
      [class.btn--filter-active]="facade.filter() === undefined"
      (click)="setFilter(undefined)">
      Toutes
    </button>
  </div>

  @if (facade.loading()) {
    <p class="ca-list__state">Chargement…</p>
  } @else if (facade.actions().length === 0) {
    <p class="ca-list__state">Aucune action.</p>
  } @else {
    <div class="ca-list__grid">
      @for (action of facade.actions(); track action.publicId) {
        <app-commercial-action-card
          [action]="action"
          (completed)="onComplete($event)"
          (cancelled)="onCancel($event)"
          (edited)="facade.load()"
        />
      }
    </div>
  }

</div>
