<div class="email-compose action-panel">
  <h3 class="action-panel__title email-compose__title">
    <span class="email-compose__title-icon">✉</span> Envoyer un email
  </h3>

  <div class="email-compose__fields">
    <div class="action-panel__row">
      <label for="ec-subject">Sujet *</label>
      <input
        id="ec-subject"
        type="text"
        [(ngModel)]="subject"
        placeholder="Objet de votre email"
        maxlength="200"
        class="email-compose__input"
      />
    </div>

    <div class="action-panel__row email-compose__body-row">
      <label>Message *</label>
      <app-rich-text-editor
        [(ngModel)]="body"
        placeholder="Écrivez votre message ici… (Astuce : utilisez des variables pour personnaliser)"
      />
    </div>
  </div>

  <div class="action-panel__footer">
    <button
      class="btn email-compose__btn-send"
      (click)="onSend()"
      [disabled]="!canSend || sending()"
    >
      {{ sending() ? 'Envoi…' : 'Envoyer' }}
    </button>
    <button class="btn email-compose__btn-cancel" (click)="cancel.emit()">Annuler</button>
  </div>
</div>
