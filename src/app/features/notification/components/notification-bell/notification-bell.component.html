<!-- src/app/features/notification/components/notification-bell/notification-bell.component.html -->

<div class="notification-bell-container" #container>
  <!-- Bell button -->
  <button
    class="bell-button"
    [class.has-unread]="hasUnread()"
    [class.dropdown-open]="isDropdownOpen()"
    (click)="toggleDropdown()"
    [attr.aria-label]="'Notifications' + (unreadCount() > 0 ? ' (' + unreadCount() + ' unread)' : '')"
    aria-haspopup="true"
    [attr.aria-expanded]="isDropdownOpen()"
  >
    <!-- Bell icon -->
    <svg
      class="bell-icon"
      [class.ringing]="isRinging()"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>

    <!-- Unread badge -->
    @if (unreadCount() > 0) {
      <span class="unread-badge">
        {{ unreadCount() > 99 ? '99+' : unreadCount() }}
      </span>
    }

    <!-- Connection status indicator -->
    <span
      class="connection-indicator"
      [class.connected]="isConnected()"
      [class.reconnecting]="isReconnecting()"
      [class.disconnected]="isDisconnected()"
      [title]="connectionStatusText()"
    ></span>
  </button>

  <!-- Dropdown -->
  @if (isDropdownOpen()) {
    <app-notification-dropdown
      (close)="closeDropdown()"
    />
  }
</div>
