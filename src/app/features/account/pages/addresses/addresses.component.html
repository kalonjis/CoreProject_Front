<!-- src/app/features/account/pages/addresses/addresses.component.html -->

<div class="account-addresses">

  <!-- Page Header -->
  <header class="page-header">
    <a routerLink="/account/profile" class="back-link">
      <i class="lucide lucide-arrow-left"></i>
      Retour au profil
    </a>
    <h1 class="page-title">
      <span class="page-icon">📍</span>
      Mes Adresses
    </h1>
    <p class="page-subtitle">
      Gérez vos adresses de livraison et de facturation
    </p>
  </header>

  <!-- Main Content -->
  <div class="page-content" [class.page-content--with-detail]="selectedAddress()">

    <!-- Address List -->
    <section class="addresses-section">
      <app-address-list
        [addresses]="addresses()"
        [config]="listConfig"
        [isLoading]="isLoading()"
        [selectedPublicId]="selectedAddress()?.publicId ?? null"
        (onCreate)="handleCreate()"
        (onAction)="handleAction($event)"
        (onSelect)="handleSelect($event)">
      </app-address-list>
    </section>

    <!-- Detail Panel (slide-in) -->
    @if (selectedAddress(); as address) {
      <aside class="detail-panel">
        <app-address-detail
          [address]="address"
          [showActions]="true"
          (onEdit)="handleDetailEdit($event)"
          (onDelete)="handleDetailDelete($event)"
          (onClose)="closeDetail()">
        </app-address-detail>
      </aside>
    }
  </div>

  <!-- Form Modal -->
  <app-address-form-modal
    [isOpen]="showModal()"
    [mode]="modalMode()"
    [address]="addressToEdit()"
    [config]="formConfig"
    [isSubmitting]="isSubmitting()"
    (onClose)="closeModal()"
    (onSave)="handleSave($event)">
  </app-address-form-modal>
</div>
