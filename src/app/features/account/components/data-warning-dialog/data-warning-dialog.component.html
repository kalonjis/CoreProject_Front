<!-- src/app/features/account/components/data-warning-dialog/data-warning-dialog.component.html -->

<div class="dialog-overlay">
  <div class="dialog-container">

    <!-- Header -->
    <div class="dialog-header">
      <span class="dialog-icon">📦</span>
      <h3 class="dialog-title">Before you go — your data</h3>
    </div>

    <!-- Content -->
    <div class="dialog-content">
      <p class="dialog-message">
        Under GDPR, you have the right to a copy of all personal data we hold about you
        before it is permanently deleted.
      </p>
      <p class="dialog-message dialog-message--emphasis">
        Once your account is deleted, this data cannot be recovered.
        Do you want to download it first?
      </p>
    </div>

    <!-- Actions -->
    <div class="dialog-actions">

      <button class="action-btn action-btn--export" (click)="onExportData()">
        <span class="action-btn__icon">📥</span>
        <span class="action-btn__label">Download my data first</span>
      </button>

      <div class="actions-divider">
        <span>or</span>
      </div>

      <button class="action-btn action-btn--delete" (click)="onProceedDelete()">
        <span class="action-btn__label">Continue with deletion</span>
      </button>

    </div>

  </div>
</div>
