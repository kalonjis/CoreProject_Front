<!-- src/app/features/admin/dashboard/admin-dashboard.component.html -->

<div class="admin-dashboard">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="header-content">
      <h1>Admin Dashboard</h1>
      <p class="header-subtitle">Manage your application from here</p>
    </div>

    @if (isSuperAdmin()) {
      <div class="super-admin-badge">
        <span class="badge-icon">👑</span>
        <span class="badge-text">Super Admin</span>
      </div>
    }
  </div>

  <!-- Module Cards Grid -->
  <div class="modules-grid">
    @for (module of modules(); track module.id) {
      <app-module-card [config]="module"></app-module-card>
    }
  </div>

  <!-- Info Banner -->
  <div class="info-banner">
    <span class="info-icon">💡</span>
    <span class="info-text">
      @if (isSuperAdmin()) {
        You have full access to all admin modules.
      } @else {
        More modules coming soon. Contact a Super Admin for extended access.
      }
    </span>
  </div>
</div>
